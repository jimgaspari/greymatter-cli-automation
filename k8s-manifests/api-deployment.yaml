apiVersion: v1
kind: Namespace
metadata:
  name: cli-api-jobs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-api
  namespace: cli-api-jobs
  labels:
    app: cli-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cli-api
  template:
    metadata:
      labels:
        app: cli-api
    spec:
      # API SA (low privilege)
      serviceAccountName: cli-api
      containers:
        - name: api
          image: cli-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Auth token for API
            - name: CLI_API_TOKEN
              value: "devtoken"

            # Where the app uses workspace dirs
            - name: CLI_API_WORKDIR
              value: "/work"

            # Where jobs + input secrets are created
            - name: CLI_API_JOBS_NAMESPACE
              value: "cli-api-jobs"

            # Image used for job runner pods (can be same image as API)
            - name: CLI_API_RUNNER_IMAGE
              value: "cli-api:dev"

            # Runner service account name (used by jobs.py)
            - name: CLI_API_RUNNER_SERVICE_ACCOUNT
              value: "cli-api-job-runner"

            # Optional logging
            - name: LOG_LEVEL
              value: "INFO"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false

          volumeMounts:
            - name: work
              mountPath: /work

      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cli-api
  namespace: cli-api-jobs
  labels:
    app: cli-api
spec:
  selector:
    app: cli-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
