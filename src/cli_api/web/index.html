<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Greymatter Bootstrap Demo</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
    <header>
        <h1>Greymatter Bootstrap Demo</h1>
        <p>Static UI for testing. Real usage should be via the API.</p>
    </header>

    <section class="card">
        <h2>Auth</h2>
        <label>
            X-API-Token
            <input id="apiToken" type="password" placeholder="devtoken (if enabled)" />
        </label>
    </section>

    <section class="card">
        <h2>Clone</h2>

        <div class="row">
            <label>
                Method
                <select id="cloneType">
                    <option value="ssh">SSH</option>
                    <option value="https">HTTPS</option>
                </select>
            </label>

            <label>
                Repo URL
                <input id="repoUrl" type="text" placeholder="git@host:owner/repo.git OR https://host/owner/repo.git" />
            </label>
        </div>

        <div class="row">
            <label>
                Branch
                <input id="branch" type="text" value="main" />
            </label>

            <label>
                Depth
                <input id="depth" type="number" value="1" min="0" />
            </label>
        </div>

        <div id="sshFields">
            <label>
                SSH private key (base64)
                <textarea id="sshKeyB64" placeholder="paste key.b64 contents"></textarea>
            </label>

            <label>
                known_hosts (raw)
                <textarea id="knownHosts" placeholder="paste known_hosts contents"></textarea>
            </label>

            <label class="checkbox">
                <input id="strictHostKeyChecking" type="checkbox" checked />
                Strict host key checking
            </label>
        </div>

        <div id="httpsFields" style="display:none;">
            <div class="row">
                <label>
                    Username (optional)
                    <input id="httpsUsername" type="text" placeholder="e.g. jimgaspari or oauth2" />
                </label>

                <label>
                    Token (optional)
                    <input id="httpsToken" type="password" placeholder="PAT/token (if repo is private)" />
                </label>
            </div>

            <label>
                Password (optional, avoid if using token)
                <input id="httpsPassword" type="password" placeholder="basic auth password" />
            </label>
        </div>
    </section>

    <section class="card">
        <h2>Core Bootstrap Options</h2>
        <p>These map to <code>greymatter create platform</code> flags.</p>

        <div class="row">
            <label>
                Display name
                <input id="displayName" type="text" placeholder="Greymatter Mesh" />
            </label>

            <label>
                Namespace
                <input id="namespace" type="text" placeholder="greymatter" />
            </label>
        </div>

        <div class="row">
            <label>
                Security (plaintext | spire | pki)
                <input id="security" type="text" placeholder="spire" />
            </label>

            <label>
                OpenShift
                <select id="openshift">
                    <option value="false" selected>false</option>
                    <option value="true">true</option>
                </select>
            </label>
        </div>

        <div class="row">
            <label>
                Image repository
                <input id="imageRepository" type="text" placeholder="oci.download.greymatter.io" />
            </label>

            <label>
                Image pull secret
                <input id="imagePullSecret" type="text" placeholder="greymatter-image-pull" />
            </label>
        </div>

        <div class="row">
            <label>
                Spire namespace
                <input id="spireNamespace" type="text" placeholder="spire" />
            </label>

            <label class="checkbox">
                <input id="noManagedSpire" type="checkbox" />
                --no-managed-spire
            </label>
        </div>

        <div class="row">
            <label>
                Prometheus address (host:port)
                <input id="prometheusAddress" type="text" placeholder="prometheus.monitoring.svc:9090" />
            </label>

            <label>
                Elasticsearch address (host:port)
                <input id="elasticsearchAddress" type="text" placeholder="elasticsearch.monitoring.svc:9200" />
            </label>
        </div>

        <label class="checkbox">
            <input id="noElasticsearchTlsVerify" type="checkbox" />
            --no-elasticsearch-tls-verify
        </label>

        <div class="row">
            <label>
                Tenant namespaces (comma-separated)
                <input id="tenantNamespaces" type="text" placeholder="tenant-a,tenant-b" />
            </label>

            <label>
                PKI cert secret (if security=pki)
                <input id="pkiCert" type="text" placeholder="(edge-cert)" />
            </label>
        </div>

        <label class="checkbox">
            <input id="noGitopsFips" type="checkbox" />
            --no-gitops-fips
        </label>
    </section>

    <section class="card">
        <h2>Run</h2>
        <div class="row">
            <button id="runCore">Bootstrap Core</button>
            <input id="tenantName" type="text" placeholder="tenant name (for tenant bootstrap)" />
            <button id="runTenant">Bootstrap Tenant</button>
        </div>
    </section>

    <section class="card">
        <h2>Result</h2>
        <pre id="result">(no run yet)</pre>
    </section>

    <script src="/static/app.js"></script>
</body>

</html>
