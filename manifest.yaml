# ------------------------------------------------------------
# Namespace where the API creates the "secrets job" + stores input secrets
# ------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: cli-api-jobs

---
# ------------------------------------------------------------
# ServiceAccount used by the API Deployment
# ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cli-api
  namespace: cli-api-jobs

---
# ------------------------------------------------------------
# ServiceAccount used by Jobs (secrets job + bootstrap job)
# (Secrets job runs in cli-api-jobs; bootstrap job runs in target namespace)
# ------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cli-api-job-runner
  namespace: cli-api-jobs

---
# ------------------------------------------------------------
# API RBAC (namespace-scoped): manage jobs + store input secrets in cli-api-jobs,
# plus read pods/logs for debugging.
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cli-api-role
  namespace: cli-api-jobs
rules:
  # create and monitor jobs in cli-api-jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]

  # store input secrets + optional run records
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "list", "watch", "patch", "update", "delete"]

  # find job pods + read logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cli-api-rolebinding
  namespace: cli-api-jobs
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cli-api-role

---
# ------------------------------------------------------------
# API RBAC (cluster-wide): allow the API to create Jobs in target namespaces.
# This is convenient for dev, but broad.
#
# If you want least privilege, remove this ClusterRoleBinding and instead create
# a Role + RoleBinding in each allowed target namespace granting "jobs create".
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-api-create-jobs-any-namespace
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]

  # Optional: if you want API to also read pods/logs in target namespaces:
  # - apiGroups: [""]
  #   resources: ["pods", "pods/log"]
  #   verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-create-jobs-any-namespace-binding
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-api-create-jobs-any-namespace

---
# ------------------------------------------------------------
# Job runner RBAC (cluster-wide):
# Secrets job needs to:
#  - create namespaces (optional but requested)
#  - create/update/patch secrets in target namespaces
#
# This is broad but aligned with your described workflow.
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-api-job-runner-secrets
rules:
  # create namespace (cluster-scoped)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]

  # create/apply secrets in any namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-job-runner-secrets-binding
subjects:
  - kind: ServiceAccount
    name: cli-api-job-runner
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-api-job-runner-secrets
---
# ------------------------------------------------------------
# Allow the API pod (SA: cli-api) to create/apply namespaces.
# Needed because the API calls kubectl apply for Namespace.
# ------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-api-manage-namespaces
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-manage-namespaces-binding
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-api-manage-namespaces

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-api-manage-secrets-any-namespace
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-manage-secrets-any-namespace-binding
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-api-manage-secrets-any-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cli-api-install-platform-operator
rules:
  # CRDs (cluster-scoped)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

  # Cluster RBAC objects created by the operator manifest
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-install-platform-operator-binding
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cli-api-install-platform-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cli-api-install-platform-operator-ns
  namespace: greymatter
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cli-api-install-platform-operator-ns-binding
  namespace: greymatter
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cli-api-install-platform-operator-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cli-api-cluster-admin
subjects:
  - kind: ServiceAccount
    name: cli-api
    namespace: cli-api-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-api
  namespace: cli-api-jobs
  labels:
    app: cli-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cli-api
  template:
    metadata:
      labels:
        app: cli-api
    spec:
      serviceAccountName: cli-api
      containers:
        - name: api
          image: cli-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Your app reads settings.api_token; set it here (optional).
            # If you leave this unset, require_token() will effectively be disabled.
            - name: CLI_API_TOKEN
              value: "devtoken"

            # Work directory inside container (if your settings use it)
            - name: CLI_API_WORKDIR
              value: "/work"

            # Jobs namespace (if you made it configurable)
            - name: CLI_API_JOBS_NAMESPACE
              value: "cli-api-jobs"

            # Runner image used by bootstrap job (make sure this matches what you loaded into kind)
            - name: CLI_API_RUNNER_IMAGE
              value: "cli-api-runner:dev"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      # Optional writable scratch space (only if you need it)
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cli-api
  namespace: cli-api-jobs
  labels:
    app: cli-api
spec:
  selector:
    app: cli-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
